name: Publish documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and verify public documentation
        id: site
        run: |
          set -euo pipefail
          app_version=$(cat terminal-workspace-release/VERSION)
          guide_version=$(cat terminal-workspace-release/GUIDE_VERSION)
          if [[ "$app_version" == *-* || "$guide_version" == *-* ]]; then
            echo "Pages 仅部署 main 稳定线，不发布开发预览。" >&2
            exit 1
          fi
          python3 tools/check.py --output dist
          echo "path=dist/Terminal-Workspace-Guide-$guide_version" >> "$GITHUB_OUTPUT"
      - name: Upload only the verified website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ steps.site.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
